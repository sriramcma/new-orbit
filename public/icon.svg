<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Orbit Ring -->
  <ellipse cx="256" cy="256" rx="160" ry="68" fill="none" stroke="url(#ringGrad1)" stroke-width="14" transform="rotate(-28 256 256)" opacity="0.9" />

  <!-- Secondary Crossed Orbit Ring -->
  <ellipse cx="256" cy="256" rx="140" ry="52" fill="none" stroke="url(#ringGrad2)" stroke-width="8" transform="rotate(38 256 256)" stroke-dasharray="8 12" opacity="0.75" />

  <!-- Core Planet / Orb -->
  <circle cx="256" cy="256" r="64" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="54" fill="#6366f1" />
  <circle cx="240" cy="240" r="18" fill="#a5b4fc" opacity="0.8" />

  <!-- Orbiting Satellites / Modules Nodes -->
  <circle cx="130" cy="188" r="14" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="382" cy="324" r="12" fill="#ec4899" filter="url(#glow)" />
  <circle cx="350" cy="170" r="9" fill="#fbbf24" />
  <circle cx="162" cy="342" r="8" fill="#34d399" />
</svg>
